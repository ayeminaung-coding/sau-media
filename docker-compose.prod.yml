name: socials-auto-upload-prod

x-app: &app
  image: ${SAU_IMAGE:?Set SAU_IMAGE to a prebuilt application image}
  env_file: .env
  restart: unless-stopped
  init: true

services:
  api:
    <<: *app
    ports:
      - "8001:8000"

  # Keep one worker on the 512 MiB Droplet. Enable Facebook only after moving
  # to a larger host: docker compose --profile facebook up -d.
  worker-facebook:
    profiles: [facebook]
    <<: *app
    command: ["python", "scripts/worker.py", "facebook"]

  worker-tiktok:
    <<: *app
    command: ["python", "scripts/worker.py", "tiktok"]

  console:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./console-dist:/usr/share/nginx/html:ro
      - ./console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
